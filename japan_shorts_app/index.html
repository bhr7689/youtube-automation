<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본쇼츠 자동 프로그램</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="portal">
    <div class="portal-topbar">
      <div class="portal-user">
        <div class="avatar-pill">남정</div>
        <span style="font-size:13px;font-weight:500;">박남정</span>
      </div>
    </div>

    <div class="portal-center">
      <span class="badge-dot">쇼치 강사 시리즈</span>

      <h1 class="portal-title">
        <span class="gradient-text">일본쇼츠</span> 자동 프로그램
      </h1>

      <p class="portal-sub">
        레퍼런스 탐색부터 일본어 번역, 자동 컷편집까지<br>
        한 번 로그인으로 세 가지 도구를 모두 사용하세요.
      </p>

      <div class="portal-cards">
        <a href="search.html" class="portal-card">
          <div class="portal-card-icon">📺</div>
          <div class="portal-card-title">레퍼런스 트래커</div>
          <div class="portal-card-desc">유튜브 채널 등록, 트렌딩 분석, 컬렉션 정리, 검색까지.</div>
          <div class="portal-card-cta">시작하기 →</div>
        </a>

        <a href="translator.html" class="portal-card">
          <div class="portal-card-icon">🌸</div>
          <div class="portal-card-title">일본어 번역봇</div>
          <div class="portal-card-desc">영어/한국어 대본을 일본어 쇼츠로 자동 변환 + TTS.</div>
          <div class="portal-card-cta">시작하기 →</div>
        </a>

        <a href="editor.html" class="portal-card">
          <div class="portal-card-icon">✂️</div>
          <div class="portal-card-title">자동 컷편집</div>
          <div class="portal-card-desc">롱폼 영상에서 쇼츠 대본에 맞춰 자동 컷편집.</div>
          <div class="portal-card-cta">시작하기 →</div>
        </a>
      </div>

      <div class="portal-footer">
        <span class="portal-footer-pill">🔒 Google OAuth</span>
        <span class="portal-footer-pill">🛡️ 개인 데이터 보호</span>
        <span class="portal-footer-pill">⚡ 한 번 로그인 = 모두 사용</span>
      </div>
    </div>
  </div>
</body>
</html>
