name: 🔟 조회수 1만+ 무인 수집

# 사장님 PC 가 꺼져 있어도 매일 자동으로 1만+ 썸네일·제목을 수집해 viral_hits.json 에
# 커밋한다. 사장님이 앱을 켜고 git pull 하면 📦 수집함 탭에서 최신분을 본다.
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 오전 7시 KST (= UTC 22:00 전날)
  workflow_dispatch:        # GitHub 웹에서 수동 실행 가능
    inputs:
      keywords:
        description: '쉼표구분 키워드 (비우면 기본 음악·플레이리스트 시드)'
        required: false
        default: ''
      video_type:
        description: 'all | long | shorts'
        required: false
        default: 'all'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # viral_hits.json 커밋 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install google-api-python-client isodate

      - name: 1만+ 무인 수집 실행
        env:
          YOUTUBE_API_KEY:  ${{ secrets.YOUTUBE_API_KEY }}
          VIRAL_KEYWORDS:   ${{ github.event.inputs.keywords   || '' }}
          VIRAL_VIDEO_TYPE: ${{ github.event.inputs.video_type || 'all' }}
          VIRAL_PERIOD_DAYS: '180'
          VIRAL_MAX:        '50'
        run: python daily_viral_collect.py

      - name: 수집 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viral_hits.json
          git diff --staged --quiet || git commit -m "🔟 일일 1만+ 수집 $(date +'%Y-%m-%d %H:%M UTC')"
          git push
