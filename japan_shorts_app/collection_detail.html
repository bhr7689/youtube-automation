<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컬렉션 · RefTracker</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/api.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-brand">RefTracker</div>
        <div class="sidebar-brand-sub">레퍼런스 채널 추적</div>
      </div>
      <nav class="nav-section">
        <a href="trend.html" class="nav-item">🔥 트렌드 피드</a>
        <a href="youtube_discover.html" class="nav-item">🌐 YouTube 발굴</a>
        <a href="search.html" class="nav-item">🔍 검색</a>
        <a href="source_finder.html" class="nav-item">🕵️ 원본 소스 찾기</a>
        <a href="channels.html" class="nav-item">📺 레퍼런스 채널</a>
        <a href="collections.html" class="nav-item active">📁 컬렉션</a>
        <a href="bookmarks.html" class="nav-item">⭐ 북마크</a>
        <a href="notifications.html" class="nav-item">🔔 알림 <span class="nav-badge">3</span></a>
        <a href="settings.html" class="nav-item">⚙️ 설정</a>
      </nav>
      <div class="nav-divider"></div>
      <nav class="nav-section">
        <a href="index.html" class="nav-item-secondary"><span>🏠 포털 메인</span><span>›</span></a>
        <a href="translator.html" class="nav-item-secondary"><span>🌸 일본어 번역봇</span><span>›</span></a>
        <a href="editor.html" class="nav-item-secondary"><span>✂️ 자동 컷편집</span><span>›</span></a>
      </nav>
      <div class="version">v0.4.0</div>
    </aside>

    <main class="main">
      <div class="page-header-row">
        <div>
          <div class="breadcrumb">
            <a href="collections.html">📁 컬렉션</a>
            <span class="sep">›</span>
            <span class="current" id="crumbName">폴더</span>
          </div>
          <h1 class="page-title">📁 <span id="folderName">폴더</span></h1>
          <p class="page-sub" id="folderSub">이 폴더에 모아둔 레퍼런스 채널</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-primary" id="addBtn">+ 채널 추가</button>
        </div>
      </div>

      <div class="section-label">📺 이 폴더의 채널 (<span id="cnt">0</span>)</div>
      <div class="card-grid cols-3" id="chanGrid"></div>
      <div id="empty" style="display:none;" class="empty-state">
        <div class="empty-state-title">아직 채널이 없습니다</div>
        <div class="empty-state-sub">“+ 채널 추가”로 등록된 레퍼런스 채널을 이 폴더에 담아보세요</div>
      </div>
    </main>
  </div>

  <!-- 채널 추가 모달 -->
  <div class="modal-backdrop" id="pickModal" style="display:none;">
    <div class="modal" style="max-width:520px;">
      <button class="modal-close" onclick="closePick()">×</button>
      <div style="font-size:17px;font-weight:700;margin-bottom:4px;">📺 폴더에 채널 추가</div>
      <div style="color:#8a80a5;font-size:13px;margin-bottom:14px;">등록된 레퍼런스 채널 중에서 골라 담습니다</div>
      <div id="pickList" style="max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:8px;"></div>
    </div>
  </div>

  <script>
    const CID = new URLSearchParams(location.search).get("id");
    let COL = null;

    function chanCard(ch, inFolder) {
      return `
        <div class="folder-card" data-cid="${esc(ch.channel_id)}" style="cursor:default;">
          <div class="folder-card-top">
            <div class="channel-avatar" style="background:${avatarColor(ch.title || ch.channel_id)};width:40px;height:40px;"></div>
            ${inFolder ? '<div class="folder-actions"><span title="폴더에서 빼기" data-act="remove">×</span></div>' : ''}
          </div>
          <div>
            <div class="folder-name">${esc(ch.title || ch.channel_id)}</div>
            <div class="folder-meta">${ch.age_months !== undefined && ch.age_months < 900 ? "🌱 " + ch.age_months + "개월" : "레퍼런스 채널"}</div>
          </div>
          <div style="display:flex;gap:8px;margin-top:4px;">
            <a class="btn-secondary" href="https://youtube.com/channel/${esc(ch.channel_id)}" target="_blank" style="text-decoration:none;font-size:12px;">▶ 채널 열기</a>
          </div>
        </div>`;
    }

    async function load() {
      if (!CID) { location.href = "collections.html"; return; }
      COL = await api(`/api/collections/${CID}`);
      document.getElementById("folderName").textContent = COL.name;
      document.getElementById("crumbName").textContent = COL.name;
      document.title = COL.name + " · 컬렉션 · RefTracker";
      const chans = COL.channels || [];
      document.getElementById("cnt").textContent = chans.length;
      document.getElementById("folderSub").textContent = `이 폴더에 모아둔 레퍼런스 채널 ${chans.length}개`;
      document.getElementById("empty").style.display = chans.length ? "none" : "block";
      document.getElementById("chanGrid").innerHTML = chans.map(c => chanCard(c, true)).join("");
    }

    // 폴더에서 채널 빼기
    document.getElementById("chanGrid").addEventListener("click", async (e) => {
      if (e.target.dataset.act !== "remove") return;
      const cid = e.target.closest(".folder-card").dataset.cid;
      await api(`/api/collections/${CID}/channels/${encodeURIComponent(cid)}`, { method: "DELETE" });
      toast("폴더에서 뺐어요"); load();
    });

    // 채널 추가 모달 — 등록된 레퍼런스 채널 목록에서 선택
    document.getElementById("addBtn").onclick = async () => {
      const d = await api("/api/channels");
      const inFolder = new Set((COL.channels || []).map(c => c.channel_id));
      const avail = (d.channels || []).filter(c => !inFolder.has(c.channel_id));
      const list = document.getElementById("pickList");
      if (!avail.length) {
        list.innerHTML = '<div style="color:#8a80a5;padding:20px;text-align:center;line-height:1.7;">추가할 등록 채널이 없어요.<br>검색·발굴·트렌드 화면에서 채널을 <b>+ 추가</b>하면 여기에 나타납니다.</div>';
      } else {
        list.innerHTML = avail.map(c => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #eee;border-radius:12px;">
            <div class="channel-avatar" style="background:${avatarColor(c.title || c.channel_id)};"></div>
            <div style="flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.title || c.channel_id)}</div>
            <button class="btn-add" data-cid="${esc(c.channel_id)}" data-title="${esc(c.title || "")}">+ 담기</button>
          </div>`).join("");
      }
      document.getElementById("pickModal").style.display = "flex";
    };

    document.getElementById("pickList").addEventListener("click", async (e) => {
      const btn = e.target.closest(".btn-add");
      if (!btn) return;
      await api(`/api/collections/${CID}/channels`, {
        method: "POST",
        body: JSON.stringify({ channel_id: btn.dataset.cid, title: btn.dataset.title, payload: {} }),
      });
      toast("📁 폴더에 담았어요");
      btn.outerHTML = '<span style="color:#059669;font-size:13px;font-weight:600;">✓ 담김</span>';
      COL = await api(`/api/collections/${CID}`);  // 로컬 상태 갱신
    });

    function closePick() { document.getElementById("pickModal").style.display = "none"; load(); }
    document.getElementById("pickModal").addEventListener("click", e => { if (e.target.id === "pickModal") closePick(); });

    load();
  </script>
</body>
</html>
