name: 📚 키워드별 레퍼런스 영상 수집 (WF-1)

# 기획서 WF-1 'YouTube Keyword Collector' — 매일 새벽 3:30 KST.
# Notion 'Search Keyword Master' DB의 ACTIVE 키워드를 모두 처리해
# 'YouTube Reference Videos' DB에 영상별 한 줄씩 upsert.
on:
  schedule:
    # 매시간 정각 실행 — 실제 수집 여부는 schedule_config.json (사용자가 Streamlit
    # 에서 선택한 요일/시간) 과 매칭될 때만 진행. cron 자체를 사용자가 바꿀
    # 필요 없음 (--check-schedule 플래그가 자동 필터링).
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      per_keyword:
        description: '키워드당 영상 개수'
        required: false
        default: '15'
      days:
        description: '최근 N일 영상만 (0=전체)'
        required: false
        default: '90'
      priority_filter:
        description: 'Priority 필터 (예: A 또는 A,B). 비우면 전체'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install google-api-python-client requests
      - name: 키워드 수집 실행
        env:
          YOUTUBE_API_KEY:                ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_TOKEN:                   ${{ secrets.NOTION_TOKEN }}
          NOTION_KEYWORD_MASTER_DB_ID:    ${{ secrets.NOTION_KEYWORD_MASTER_DB_ID }}
          NOTION_REFERENCE_VIDEOS_DB_ID:  ${{ secrets.NOTION_REFERENCE_VIDEOS_DB_ID }}
          COLLECT_PER_KEYWORD:            ${{ github.event.inputs.per_keyword     || '15' }}
          COLLECT_DAYS:                   ${{ github.event.inputs.days            || '90' }}
          COLLECT_PRIORITY_FILTER:        ${{ github.event.inputs.priority_filter || '' }}
        # schedule 트리거(매시간)일 때는 --check-schedule 로 schedule_config.json
        # 매칭 시에만 실제 수집. 수동 실행(workflow_dispatch)은 무조건 즉시 실행.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python keyword_collector.py --check-schedule
          else
            python keyword_collector.py
          fi
